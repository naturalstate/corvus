# ©AngelaMos | 2026
# Cargo.toml

[package]
name = "corvus"
description = "JA3/JA4 TLS fingerprinting tool with live capture, intel matching, and anomaly detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "corvus"

[[bin]]
name = "corvus"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
corvus-core.workspace = true
corvus-intel.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pcap-parser.workspace = true
pcap.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
flume.workspace = true
axum.workspace = true
tower-http.workspace = true
tower.workspace = true
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
clap.workspace = true
etherparse.workspace = true
smallvec.workspace = true
thiserror.workspace = true
rustix.workspace = true
# crossterm is not a direct dependency: ratatui re-exports the exact version it
# was built against, and depending on it separately pulls in a second,
# incompatible copy.
ratatui = { workspace = true, optional = true }

[features]
default = ["tui"]
# The full-screen terminal dashboard. Building with --no-default-features drops
# ratatui entirely; pcap, live, serve, and intel are unaffected.
tui = ["dep:ratatui"]
